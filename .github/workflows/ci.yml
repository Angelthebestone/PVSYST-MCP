name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    # Windows: the GUI automation module calls Win32 directly.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: python tools/check_deps.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        working-directory: npm
      - run: npm audit --audit-level=high
        working-directory: npm

  coverage:
    # Needs the MSVC toolchain (profiler runtime); the local GNU toolchain lacks it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --summary-only

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy pytest
      - run: ruff check tools
      - run: ruff format --check tools
      - run: mypy --strict tools
      - run: pytest -q tools
